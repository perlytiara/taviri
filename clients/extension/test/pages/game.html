<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Star Pilots — Sign in</title>
<link rel="icon" href="data:,">
<style>body{background:#0b1020;color:#e8f0ff;font:16px system-ui;margin:40px}</style>
</head>
<body>
<h1>STAR PILOTS</h1>
<game-login></game-login>
<pre id="result"></pre>
<script>
  // A game-like sign-in: everything sits in a shadow root, the passcode field rebuilds its value
  // from key presses only (it undoes programmatic changes), and LAUNCH reacts to pointerdown only.
  customElements.define("game-login", class extends HTMLElement {
    connectedCallback() {
      const root = this.attachShadow({ mode: "open" });
      root.innerHTML = `
        <style>
          .panel{border:2px solid #4cf;border-radius:12px;padding:18px;width:320px;background:#121a33}
          input{display:block;width:100%;margin:8px 0 14px;padding:8px;background:#000;color:#4cf;border:1px solid #4cf;font:16px monospace}
          .launch{display:inline-block;padding:10px 24px;background:#4cf;color:#000;font-weight:700;border-radius:8px;cursor:pointer}
        </style>
        <div class="panel">
          <div>PILOT</div><input id="pilot" autocomplete="off">
          <div>PASSCODE</div><input id="passcode" type="password" autocomplete="off">
          <div class="launch" id="launch" role="button">LAUNCH</div>
        </div>`;
      const passcode = root.getElementById("passcode");
      let typed = "";
      passcode.addEventListener("keydown", (e) => {
        if (e.key === "Backspace") typed = typed.slice(0, -1);
        else if (e.key && e.key.length === 1) typed += e.key;
      });
      passcode.addEventListener("input", () => { if (passcode.value !== typed) passcode.value = typed; });
      root.getElementById("launch").addEventListener("pointerdown", () => {
        const result = { pilot: root.getElementById("pilot").value, passcode: passcode.value };
        document.getElementById("result").textContent = "LAUNCHED";
        document.body.dataset.result = JSON.stringify(result);
      });
    }
  });
</script>
</body>
</html>
