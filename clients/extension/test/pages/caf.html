<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>CAF Test — Mon Compte</title>
<link rel="icon" href="data:,">
<style>body{font:15px system-ui;margin:40px;max-width:560px}label{display:block;margin-top:12px}input,select,button{font:inherit;padding:6px;margin-top:4px}</style>
</head>
<body>
<h1>Mon Compte (test)</h1>
<p>Fake site for the Smartfill fork tests. Extra login fields are matched by their labels.</p>
<form id="login" method="post" action="/submit">
  <label for="num">Numéro allocataire <span aria-hidden="true">*</span></label>
  <input id="num" name="numeroAllocataire" type="text" inputmode="numeric">

  <label for="code">Code confidentiel</label>
  <input id="code" name="codeConfidentiel" type="password">

  <input id="dob" name="dob" placeholder="Date de naissance (JJ/MM/AAAA)">

  <label for="pays">Pays</label>
  <select id="pays" name="pays">
    <option value="">--</option>
    <option value="FR">France</option>
    <option value="BE">Belgique</option>
  </select>

  <div style="margin-top:12px"><span id="lblclient">Identifiant client</span>
    <input id="cid" name="cid" aria-labelledby="lblclient"></div>

  <label for="c1">Code</label><input id="c1" name="c1">
  <label for="c2">Code</label><input id="c2" name="c2">

  <label><input type="checkbox" id="remember" name="remember"> Se souvenir de moi</label>
  <button type="submit" id="connect">Se connecter</button>
</form>
</body>
</html>
