# The whole vault: the server and the HTTPS front door.
# Both share the Pi's network directly, so the Pi's firewall decides who can reach them
# (Docker's own port publishing would bypass it). The server listens on 127.0.0.1 only.
name: pi-vault

services:
  vault:
    build:
      context: ./image
      args:
        VW_VERSION: ${VW_VERSION}
    image: pi-vault/vault:${VW_VERSION}
    container_name: pi-vault
    restart: unless-stopped
    network_mode: host
    user: "${VAULT_UID}:${VAULT_GID}"
    env_file:
      - vault.env
    environment:
      ROCKET_ADDRESS: 127.0.0.1
      ROCKET_PORT: "8732"
      DATA_FOLDER: /data
      LOG_FILE: /logs/vaultwarden.log
    volumes:
      - /srv/pi-vault/data:/data
      - /var/log/pi-vault:/logs
      - /etc/localtime:/etc/localtime:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  caddy:
    image: docker.io/library/caddy:${CADDY_VERSION}
    container_name: pi-vault-caddy
    restart: unless-stopped
    network_mode: host
    depends_on:
      - vault
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/pi-vault/caddy/data:/data
      - /srv/pi-vault/caddy/config:/config
      - /srv/pi-vault/status:/srv/status:ro
      # Lets Caddy ask Tailscale for the tailnet certificate.
      - /var/run/tailscale:/var/run/tailscale
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
